name: Build ERP Windows release

on:
  push:
    branches: [zsh, gy]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Windows 测试失败。' }
          if ('${{ github.ref_name }}' -eq 'gy') {
            .\.venv\Scripts\python.exe generate_erp_field_migration.py --bi-file sql/bi_dashboard_queries.sql
            $name = 'QMS-ERP数据同步工具-gy-英文字段版-20261028-v6'
          } else {
            .\.venv\Scripts\python.exe generate_erp_field_migration.py --skip-bi-validation
            $name = 'QMS-ERP数据同步工具-zsh-英文字段版-20261022'
          }
          if ($LASTEXITCODE -ne 0) { throw '字段迁移文件生成失败。' }
          .\build_exe.ps1 -Name $name
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'gy' && 'gy-windows-release-20261028-v6' || 'zsh-windows-release-20261026-v3' }}
          path: dist/*-发布包/*
          if-no-files-found: error
